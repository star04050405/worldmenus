<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名店点餐单 · ORDER AROUND THE WORLD</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="theme-color" content="#F6F1E7">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:Cormorant,Georgia,"Songti SC","Noto Serif SC","STSong",serif;
  background:#F6F1E7;color:#2B2621;line-height:1.9;letter-spacing:.02em;
  padding-bottom:90px;
  background-image:repeating-linear-gradient(0deg,transparent 0 33px,rgba(150,130,100,.07) 33px 34px);
}
.mono{font-family:"Courier New",Courier,monospace;letter-spacing:.18em;text-transform:uppercase}
.wrap{max-width:560px;margin:0 auto;padding:0 24px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
/* ============ 封面 ============ */
.head{padding-top:56px;text-align:center}
.head .est{font-size:10px;color:#8A7A5E}
.head h1{font-size:42px;font-weight:600;letter-spacing:.04em;margin:6px 0 2px}
.head h1 i{font-style:italic;font-weight:500}
.head .sub{font-style:italic;font-size:15px;color:#8A7A5E}
.head .sub b{color:#B08A4F;font-style:normal}
.rule{display:flex;align-items:center;gap:10px;margin:26px 0 6px}
.rule .l{flex:1;height:1px;background:#D8CBB2}
.rule .s{font-size:10px;color:#A08A66;font-family:"Courier New",monospace;letter-spacing:.3em}
/* ============ 店列表 ============ */
.shop{display:block;width:100%;text-align:left;border-bottom:1px solid #E2D6BE;padding:17px 4px 15px;position:relative}
.shop .row1{display:flex;align-items:baseline;gap:10px}
.shop .nm{font-size:21px;font-weight:600;letter-spacing:.03em}
.shop .cty{font-size:11px;color:#8A7A5E;font-family:"Courier New",monospace;letter-spacing:.14em;white-space:nowrap}
.shop .row2{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.shop .yrs{font-size:11px;color:#A08A66;font-family:"Courier New",monospace;letter-spacing:.14em}
.shop .dsc{font-size:12px;color:#7C6E58;flex:1}
.shop .bar{position:absolute;left:0;top:16px;bottom:14px;width:3px;border-radius:2px}
.shop .go{font-size:20px;color:#C4B493;position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.shop .bag{position:absolute;right:34px;top:50%;transform:translateY(-50%);font-size:10px;color:#fff;font-family:"Courier New",monospace;letter-spacing:.06em;background:#B08A4F;padding:1px 7px;border-radius:9px;display:none}
.shop .bag.on{display:block}
.shop:active{background:#F0E9DA}
/* ============ footer ============ */
.foot{margin:40px 0 26px;text-align:center;font-size:11px;color:#A08A66;line-height:2}
.foot .en{font-family:"Courier New",monospace;letter-spacing:.24em;font-size:10px;color:#B49F7C}
/* ============ 菜单页 ============ */
#menu{position:fixed;inset:0;background:#F6F1E7;overflow-y:auto;display:none;z-index:30;overscroll-behavior:contain}
#menu.on{display:block}
.mwrap{max-width:560px;margin:0 auto;padding:0 24px 140px}
.mhead{padding:52px 0 0;position:relative}
.back{font-size:12px;color:#8A7A5E;font-family:"Courier New",monospace;letter-spacing:.16em;padding:8px 0;display:inline-block}
.mhead .city{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.3em;color:#8A7A5E}
.mhead h2{font-size:34px;font-weight:600;line-height:1.25;margin:4px 0 0}
.mhead .sub{font-style:italic;font-size:14px;color:#8A7A5E}
.mhead .meta{font-size:10px;color:#A08A66;font-family:"Courier New",monospace;letter-spacing:.18em;margin-top:8px}
.mhead .stripe{height:4px;margin:18px 0 4px}
.note{font-size:12px;color:#7C6E58;font-style:italic;border:1px dashed #D8CBB2;padding:10px 14px;margin:14px 0 6px;line-height:1.8}
/* 菜单项 */
.item{border-bottom:1px solid #E2D6BE;padding:15px 2px 13px}
.item .t{display:flex;align-items:baseline;gap:10px}
.item .nm{font-size:17px;font-weight:600;letter-spacing:.02em;flex:1}
.item .pr{font-family:"Courier New",monospace;font-size:14px;white-space:nowrap;color:#2B2621}
.item .nm .orig{font-weight:400;font-size:11px;color:#A08A66;font-style:italic;margin-left:6px;letter-spacing:.03em}
.item .d{font-size:12px;color:#7C6E58;line-height:1.7;margin-top:1px}
.item .ctl{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:8px}
.item .ctl .q{font-family:"Courier New",monospace;font-size:14px;min-width:22px;text-align:center;color:#8A6A2F}
.step{width:30px;height:30px;border:1px solid #D0C3A8;border-radius:50%;font-size:17px;color:#8A7A5E;background:#FBF8F0;line-height:1}
.step:active{background:#EFE7D4}
.item.hot .ctl .q{color:#B08A4F}
/* ============ 底部点单条 ============ */
.cart{position:fixed;left:0;right:0;bottom:0;background:rgba(43,38,33,.96);color:#F6F1E7;z-index:35;transform:translateY(100%);transition:transform .25s}
.cart.on{transform:translateY(0)}
.cin{max-width:560px;margin:0 auto;display:flex;align-items:center;padding:12px 24px calc(12px + env(safe-area-inset-bottom));gap:14px}
.cart .info{flex:1;line-height:1.5}
.cart .info .n{font-size:13px;font-weight:600}
.cart .info .n .shp{color:#D8B96A}
.cart .info .s{font-size:11px;color:#BFB49E;font-family:"Courier New",monospace;letter-spacing:.08em}
.orderBtn{background:#D8B96A;color:#2B2621;font-weight:600;font-size:14px;letter-spacing:.14em;padding:11px 26px;border-radius:24px;position:relative;overflow:hidden;transition:transform .15s}
.orderBtn:active{transform:scale(.94)}
.orderBtn.confirming{background:#2B2621;color:#D8B96A;border:1px solid #D8B96A}
/* ============ 小票 ============ */
#ticket{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(30,25,20,.55)}
#ticket.on{display:flex}
.tk{width:88%;max-width:340px;background:#FBF7EF;margin-bottom:8vh;padding:26px 22px 22px;position:relative;font-family:"Courier New",Courier,monospace;color:#33302A;box-shadow:0 18px 50px rgba(0,0,0,.4);transform:translateY(60px);opacity:0;transition:all .35s cubic-bezier(.2,.9,.3,1.1)}
#ticket.on .tk{transform:translateY(0);opacity:1}
.tk:before{content:"";position:absolute;top:-7px;left:14px;right:14px;height:14px;
 background:linear-gradient(135deg,transparent 33.33%,#FBF7EF 33.33%,#FBF7EF 66.66%,transparent 66.66%),
 linear-gradient(45deg,transparent 33.33%,#FBF7EF 33.33%,#FBF7EF 66.66%,transparent 66.66%);
 background-size:14px 28px;background-position:0 -14px;z-index:2}
.tk .shop{font-size:15px;font-weight:700;letter-spacing:.2em;text-align:center;text-transform:uppercase}
.tk .c{text-align:center;font-size:9px;letter-spacing:.3em;color:#8A7A5E;margin:2px 0 8px}
.tk .dline{border-top:1px dashed #B9AC92;margin:8px 0}
.tk .li{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.04em;padding:2.5px 0}
.tk .li .q{color:#666}
.tk .tot{display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.1em}
.tk .note{border:none;padding:0;margin:8px 0 0;font-size:8.5px;color:#9A8C72;font-style:normal;text-align:center;letter-spacing:.12em;font-family:"Courier New",Courier,monospace}
.tk .stamp{margin:12px auto 0;width:78px;height:78px;border:2px solid rgba(178,60,60,.7);border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);color:rgba(178,60,60,.85);font-size:9px;letter-spacing:.14em;text-align:center;line-height:1.5}
.tkBtns{display:flex;gap:10px;margin-top:16px}
.tkBtns button{flex:1;border:1px solid #2B2621;padding:9px 0;font-size:11px;letter-spacing:.2em;font-family:"Courier New",Courier,monospace}
.tkBtns .prim{background:#2B2621;color:#F6F1E7}
/* toast */
#toast{position:fixed;left:50%;transform:translate(-50%,20px);top:-60px;background:rgba(43,38,33,.94);color:#F6F1E7;font-size:12px;letter-spacing:.1em;padding:9px 22px;border-radius:22px;z-index:80;opacity:0;transition:all .3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0);top:18px}
/* ============ 小票墙 ============ */
#wall{position:fixed;inset:0;background:#F6F1E7;overflow-y:auto;display:none;z-index:28}
#wall.on{display:block}
.wallhead{padding:52px 0 0;position:relative}
.wallhead .city{font-family:"Courier New",Courier,monospace;font-size:10px;letter-spacing:.3em;color:#8A7A5E}
.wallhead h2{font-size:30px;font-weight:600}
.wallhead .sub{font-style:italic;font-size:13px;color:#8A7A5E}
.rrow{border-bottom:1px solid #E2D6BE;padding:15px 2px;position:relative}
.rrow .top{display:flex;align-items:baseline;gap:10px}
.rrow .no{font-family:"Courier New",Courier,monospace;font-size:11px;color:#A08A66;letter-spacing:.12em}
.rrow .nm{font-size:17px;font-weight:600;flex:1}
.rrow .n{font-size:12px;color:#7C6E58}
.rrow .amt{font-family:"Courier New",Courier,monospace;font-size:14px}
.rrow .dt{font-size:10px;color:#A08A66;font-family:"Courier New",Courier,monospace;letter-spacing:.1em;margin-top:2px}
.rrow .bar{position:absolute;left:0;top:15px;bottom:13px;width:3px;border-radius:2px}
.rrow .del{position:absolute;right:0;top:15px;font-size:13px;color:#C0A887;padding:2px 6px}
.empty{text-align:center;padding:60px 0;color:#B0A084;font-style:italic}
.empty .big{font-size:40px;margin-bottom:6px}
</style>
</head>

<div id="toast"></div>

<!-- ============ 首页 ============ -->
<div id="home" class="wrap">

    <div class="est mono">est. 2026 · a menu collection</div>

    <div class="sub">ORDER AROUND THE WORLD · <b>8</b> 城 <b>8</b> 店</div>
    <div class="rule"><span class="l"></span><span class="s">LA CARTE</span><span class="l"></span></div>
  </header>

  <div id="shopList"></div>

  <div class="foot">
    <div class="en">eat well · travel far · collect receipts</div>
    <div>价格为到店参考时价，实际以店内当日为准。</div>
  </div>
</div>

<!-- ============ 小票墙 ============ -->
<div id="wall"><div class="wrap">
  <header class="wallhead">
    <button class="back mono" id="wallBack">‹ back · 返回</button>

  <div id="receiptList"></div>
  <div class="empty" id="wallEmpty"><div class="big">🧾</div>还没有小票。去名店下一单？</div>
</div></div>

<!-- ============ 菜单页 ============ -->
<div id="menu"><div class="mwrap">
  <header class="mhead" id="mhead"></header>
  <div id="items"></div>
  <div class="foot" style="margin-top:34px">
    <div class="en">bon appétit · buon appetito · いただきます</div>

</div></div>

<!-- ============ 点单条 ============ -->
<div class="cart" id="cart">
  <div class="cin">
    <div class="info">
      <div class="n" id="cartShop"></div>
      <div class="s" id="cartSum"></div>
    </div>
    <button class="orderBtn" id="orderBtn">下单 ORDER</button>
  </div>
</div>

<!-- ============ 小票 ============ -->
<div id="ticket">
  <div class="tk">
    <div class="shop" id="tkShop"></div>
    <div class="c" id="tkCity"></div>
    <div class="dline"></div>
    <div id="tkItems"></div>
    <div class="dline"></div>
    <div class="tot"><span>TOTAL</span><span id="tkTotal"></span></div>
    <div class="c" id="tkNo" style="margin-top:8px"></div>
    <div class="note" id="tkDate"></div>
    <div class="note">* 参考时价 · prices are indicative</div>
    <div class="stamp">ORDERED<br>✓ GRATZIE</div>
    <div class="tkBtns">
      <button id="tkKeep">存起来 KEEP</button>
      <button class="prim" id="tkMore">继续点 CONTINUE</button>
    </div>
  </div>
</div>

   {n:"威尼斯热巧克力", o:"Cioccolata Calda", d:"浓到勺子能立起来的那种", p:12, c:"€"},
   {n:"意式浓缩", o:"Caffè Espresso", d:"站在大理石桌边一口喝完", p:6, c:"€"},
   {n:"卡布奇诺", o:"Cappuccino", d:"上午限定，意大利规矩", p:7, c:"€"},
   {n:"普罗塞克（杯）", o:"Prosecco", d:"瓦尔多比亚德尼起泡", p:14, c:"€"},
   {n:"甜点拼盘", o:"Selezione di Dolci", d: "当日糕点三样", p:15, c:"€"},
   {n:"现场弦乐附加费", o:"Live Music Charge", d: "坐在乐队能看见的位置", p:6, c:"€"}
  ]},
 {id:"gro", name:"Grom", zh:"格罗姆", city:"FIRENZE · 佛罗伦萨", est:"EST. 2002", cat:"冰淇淋",
  desc:"不用色素香精的手工 gelato", color:"#2C4E8A",
  sub:"il vero gelato italiano",
  note:"柜子里的酱色丝带（spatola）才是招牌：开心果酱摆在最显眼处。",
  items:[
   {n:"开心果（每球）", o:"Pistacchio", d:"西西里 Bronte 产地，青酱色", p:2.9, c:"€"},
   {n:"斯特拉夏泰拉（每球）", o:"Stracciatella", d:"奶油底+黑巧脆片", p:2.9, c:"€"},
   {n:"榛子（每球）", o:"Nocciola", d:"皮埃蒙特榛子酱", p:2.9, c:"€"},
   {n:"柠檬雪芭（每球）", o:"Limone Sorbetto", d: "阿玛菲柠檬，无奶", p:2.9, c:"€"},
   {n:"酸奶（每球）", o:"Yogurt", d:"微酸解腻", p:2.9, c:"€"},
   {n:"华夫筒", o:"Cono", d:"现压薄脆筒，配两球起", p:1.5, c:"€"},
   {n:"杯装升级", o:"Coppa Media", d:"三球大杯+鲜奶油", p:2, c:"€"}
  ]}
];
/* ============ 状态 ============ */
var KEY="wm_orders",RKEY="wm_receipts";
var orders={};   /* shopId -> {itemId: qty} */
var receipts=[];
try{orders=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){orders={}}
try{receipts=JSON.parse(localStorage.getItem(RKEY))||[]}catch(e){receipts=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(orders));localStorage.setItem(RKEY,JSON.stringify(receipts))}catch(e){}}
function fmt(v){return v.toLocaleString("en-US",{minimumFractionDigits:v<100?2:0,maximumFractionDigits:2})}
function shopSum(sid){
  var s=SHOPS.filter(function(x){return x.id===sid})[0],n=0,amt=0,cur="";
  s.items.forEach(function(it,i){
    var q=(orders[sid]&&orders[sid][i])||0;
    if(q){n+=q;amt+=it.p*q;cur=it.c}
  });
  return {n:n,amt:amt,cur:cur};
}
function toast(t){
  var el=document.getElementById("toast");
  el.textContent=t;el.classList.add("on");
  clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove("on")},1600);
}
/* ============ 首页渲染 ============ */
function paintHome(){
  var h="";
  SHOPS.forEach(function(s){
    var sum=shopSum(s.id);
    var rc=receipts.filter(function(r){return r.shop===s.name}).length;
    var badge=sum.n?'<span class="bag on">'+sum.n+' 件</span>':(rc?'<span class="bag on">✔ '+rc+' 单</span>':"");
    h+='<button class="shop" data-s="'+s.id+'">';
    h+='<span class="bar" style="background:'+s.color+'"></span>';
    h+='<span class="row1"><span class="nm">'+s.name+'</span><span class="cty">'+s.city.split(" ·")[0]+'</span>'+badge+'</span>';
    h+='<span class="row2"><span class="yrs">'+s.est+' · '+s.cat+'</span><span class="dsc">'+s.desc+'</span></span>';
    h+='<span class="go">›</span></button>';
  });
  document.getElementById("shopList").innerHTML=h;
  document.querySelectorAll("#shopList .shop").forEach(function(b){
    b.addEventListener("click",function(){openMenu(b.dataset.s)});
  });
}
/* ============ 菜单页 ============ */
var cur=null;
function openMenu(sid){
  cur=sid;
  var s=SHOPS.filter(function(x){return x.id===sid})[0];
  var hh="";
  hh+='<button class="back mono" id="mBack">‹ back · 返回</button>';
  hh+='<div class="city">'+s.city+' · '+s.est+'</div>';
  hh+='<h2>'+s.name+' <span style="font-size:18px;font-weight:400">'+s.zh+'</span></h2>';
  hh+='<div class="sub">'+s.sub+'</div>';
  hh+='<div class="meta">menu · 本店 '+s.items.length+' 项</div>';
  hh+='<div class="stripe" style="background:'+s.color+'"></div>';
  document.getElementById("mhead").innerHTML=hh;
  var ih="";
  s.items.forEach(function(it,i){
    var q=(orders[sid]&&orders[sid][i])||0;
    ih+='<div class="item'+(q?" hot":"")+'" data-i="'+i+'">';
    ih+='<div class="t"><span class="nm">'+it.n+'<span class="orig">'+it.o+'</span></span><span class="pr">'+it.c+fmt(it.p)+'</span></div>';
    ih+='<div class="d">'+it.d+'</div>';
    ih+='<div class="ctl"><button class="step minus">−</button><span class="q">'+q+'</span><button class="step plus">+</button></div>';
    ih+='</div>';
  });
  document.getElementById("items").innerHTML=ih;
  var notEl=document.getElementById("mnote");
  if(!notEl){
    notEl=document.createElement("div");notEl.id="mnote";notEl.className="note";
    document.getElementById("items").insertAdjacentElement("afterend",notEl);
  }
  notEl.textContent=s.note||"";
  notEl.style.display=s.note?"":"none";
  document.getElementById("menu").classList.add("on");
  document.getElementById("menu").scrollTop=0;
  document.getElementById("home").style.display="none";
  document.getElementById("wall").classList.remove("on");
  bindMenu();
  paintCart();
  window.scrollTo(0,0);
  try{history.pushState({menu:sid},"","#"+sid)}catch(e){}
}
function bindMenu(){
  document.getElementById("mBack").addEventListener("click",closeMenu);
  document.querySelectorAll("#items .item").forEach(function(row){
    var i=+row.dataset.i;
    row.querySelector(".plus").addEventListener("click",function(){addQty(1,i,row)});
    row.querySelector(".minus").addEventListener("click",function(){addQty(-1,i,row)});
  });
}
function addQty(d,i,row){
  if(!orders[cur])orders[cur]={};
  orders[cur][i]=((orders[cur][i]||0)+d);
  if(orders[cur][i]<=0){delete orders[cur][i];if(!Object.keys(orders[cur]).length)delete orders[cur]}
  save();
  var q=(orders[cur]&&orders[cur][i])||0;
  row.querySelector(".q").textContent=q;
  row.classList.toggle("hot",q>0);
  paintCart();
}
function closeMenu(){
  document.getElementById("menu").classList.remove("on");
  document.getElementById("home").style.display="";
  paintHome();paintCart();
  try{history.pushState({},"","#")}catch(e){}
  window.scrollTo(0,0);
}
/* ============ 点单条 ============ */
var confirming=false;
function paintCart(){
  var bar=document.getElementById("cart");
  if(!cur||!orders[cur]){bar.classList.remove("on");confirming=false;setBtn();return}
  var sum=shopSum(cur),s=SHOPS.filter(function(x){return x.id===cur})[0];
  if(!sum.n){bar.classList.remove("on");confirming=false;setBtn();return}
  bar.classList.add("on");
  document.getElementById("cartShop").textContent=s.name+" · 已点 "+sum.n+" 件";
  document.getElementById("cartSum").textContent="SUBTOTAL "+sum.cur+fmt(sum.amt);
  setBtn();
}
function setBtn(){
  var b=document.getElementById("orderBtn");
  b.textContent=confirming?"确认下单 ✓ CONFIRM":"下单 ORDER";
  b.classList.toggle("confirming",confirming);
}
document.getElementById("orderBtn").addEventListener("click",function(){
  if(!confirming){confirming=true;setBtn();toast("再点一次确认下单");return}
  confirming=false;setBtn();
  /* 生成小票 */
  var s=SHOPS.filter(function(x){return x.id===cur})[0];
  var sum=shopSum(cur);
  var lines=[];
  s.items.forEach(function(it,i){
    var q=(orders[cur]&&orders[cur][i])||0;
    if(q)lines.push({n:it.n,q:q,p:it.p,cur:it.c});
  });
  var no="NO."+String(Date.now()).slice(-6);
  var dt=new Date();
  var ds=dt.getFullYear()+"."+String(dt.getMonth()+1).padStart(2,"0")+"."+String(dt.getDate()).padStart(2,"0")+" "+String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0");
  receipts.unshift({no:no,shop:s.name,city:s.city,color:s.color,items:lines,total:sum.amt,cur:sum.cur,n:sum.n,ts:ds});
  save();
  /* 渲染小票 */
  document.getElementById("tkShop").textContent=s.name;
  document.getElementById("tkCity").textContent=s.city+" · "+s.est;
  var lih="";
  lines.forEach(function(l){
    lih+='<div class="li"><span>'+l.n+' ×'+l.q+'</span><span class="q">'+l.cur+fmt(l.p*l.q)+'</span></div>';
  });
  document.getElementById("tkItems").innerHTML=lih;
  document.getElementById("tkTotal").textContent=sum.cur+fmt(sum.amt);
  document.getElementById("tkNo").textContent="* "+no+" *";
  document.getElementById("tkDate").textContent=ds+" · 参考时价";
  document.getElementById("ticket").classList.add("on");
});
document.getElementById("tkKeep").addEventListener("click",function(){
  document.getElementById("ticket").classList.remove("on");
  clearCur();toast("小票已存入收藏 🧾");
});
document.getElementById("tkMore").addEventListener("click",function(){
  document.getElementById("ticket").classList.remove("on");
  clearCur();toast("可以继续逛下一家");
});
function clearCur(){
  if(orders[cur])delete orders[cur];
  save();paintCart();
  /* 刷新菜单页数量显示 */
  if(cur){
    document.querySelectorAll("#items .item").forEach(function(row){
      var i=+row.dataset.i;
      var q=(orders[cur]&&orders[cur][i])||0;
      row.querySelector(".q").textContent=q;
      row.classList.toggle("hot",q>0);
    });
  }
}
document.getElementById("ticket").addEventListener("click",function(e){
  if(e.target===this){document.getElementById("ticket").classList.remove("on");clearCur();}
});
/* ============ 小票墙 ============ */
function paintWall(){
  var el=document.getElementById("receiptList");
  var em=document.getElementById("wallEmpty");
  if(!receipts.length){el.innerHTML="";em.style.display="";return}
  em.style.display="none";
  var h="";
  receipts.forEach(function(r,idx){
    h+='<div class="rrow" data-idx="'+idx+'">';
    h+='<span class="bar" style="background:'+r.color+'"></span>';
    h+='<div class="top"><span class="no">'+r.no+'</span><span class="nm">'+r.shop+'</span><span class="n">'+r.n+' 件</span><span class="amt">'+r.cur+fmt(r.total)+'</span></div>';
    h+='<div class="dt">'+r.city.split(" ·")[0]+' · '+r.ts+'</div>';
    h+='<button class="del">✕</button>';
    h+='</div>';
  });
  el.innerHTML=h;
  document.querySelectorAll("#receiptList .del").forEach(function(b){
    b.addEventListener("click",function(e){
      e.stopPropagation();
      var row=b.closest(".rrow"),idx=+row.dataset.idx;
      receipts.splice(idx,1);save();paintWall();toast("已删除一张小票");
    });
  });
}
/* wall 入口：首页单独入口按钮 */
var wallEntry=document.createElement("button");
wallEntry.className="shop";
wallEntry.innerHTML='<span class="bar" style="background:#2B2621"></span><span class="row1"><span class="nm">小票墙 🧾</span><span class="cty">RECEIPTS</span></span><span class="row2"><span class="yrs">MY ORDERS</span><span class="dsc">我点过的每一次单</span></span><span class="go">›</span>';
document.getElementById("shopList").after(wallEntry);
wallEntry.addEventListener("click",function(){
  document.getElementById("wall").classList.add("on");
  document.getElementById("home").style.display="none";
  paintWall();window.scrollTo(0,0);
});
document.getElementById("wallBack").addEventListener("click",function(){
  document.getElementById("wall").classList.remove("on");
  document.getElementById("home").style.display="";
  paintHome();window.scrollTo(0,0);
});
/* ============ 返回键 ============ */
window.addEventListener("popstate",function(){
  var m=document.getElementById("menu"),w=document.getElementById("wall");
  if(m.classList.contains("on")){m.classList.remove("on");document.getElementById("home").style.display="";paintHome();paintCart();}
  else if(w.classList.contains("on")){w.classList.remove("on");document.getElementById("home").style.display="";paintHome();}
});
paintHome();
</script>
</body>
</html>
